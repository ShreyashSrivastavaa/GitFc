<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Linear Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan & Purple Cyber Glow Gradient -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Emblem Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <path d="M 256 36 L 436 96 C 436 296 356 426 256 476 C 156 426 76 296 76 96 Z"
        fill="url(#cyberBorder)" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Outer Cyber Shield Frame -->
  <path d="M 256 40 L 430 98 C 430 290 352 420 256 470 C 160 420 82 290 82 98 Z"
        fill="url(#shieldBg)" stroke="url(#cyberBorder)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Tactile Inset Shield Line -->
  <path d="M 256 68 L 404 118 C 404 278 334 394 256 438 C 178 394 108 278 108 118 Z"
        fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="10 8" />

  <!-- Git Branching Fork Symbol (Top Area) -->
  <g transform="translate(196, 120)">
    <!-- Branch Lines -->
    <path d="M 28 80 L 28 20 M 28 44 C 28 44 92 40 92 20" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <!-- Branch Nodes -->
    <circle cx="28" cy="80" r="14" fill="#020617" stroke="#38bdf8" stroke-width="8" />
    <circle cx="28" cy="20" r="14" fill="#020617" stroke="#818cf8" stroke-width="8" />
    <circle cx="92" cy="20" r="14" fill="#020617" stroke="#c084fc" stroke-width="8" />
  </g>

  <!-- Bold Geometric "G" and "FC" Emblem -->
  <!-- Monogram G -->
  <path d="M 264 240 L 204 240 C 174 240 152 262 152 292 L 152 328 C 152 358 174 380 204 380 L 260 380 C 290 380 312 358 312 328 L 312 300 L 240 300" 
        fill="none" stroke="url(#goldAccent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crossed Combat Battle Swords (Backdrop behind monogram) -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="160" x2="352" y2="352" />
    <line x1="352" y1="160" x2="160" y2="352" />
  </g>

  <!-- Star Badge: Mythic Apex Star -->
  <polygon points="256,70 262,88 280,88 266,100 271,118 256,107 241,118 246,100 232,88 250,88" fill="url(#goldAccent)" />

  <!-- Bottom Competitive Tagline Banner -->
  <rect x="186" y="408" width="140" height="26" rx="13" fill="#030712" stroke="url(#cyberBorder)" stroke-width="3" />
  <text x="256" y="426" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#38bdf8" letter-spacing="3">ARENA</text>
</svg>
