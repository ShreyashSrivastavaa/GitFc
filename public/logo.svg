<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Background Shield Linear Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyan & Purple Cyber Glow Gradient -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Emblem Accent -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Shield -->
  <g transform="translate(20, 10) scale(0.27)">
    <!-- Shield Frame -->
    <path d="M 256 40 L 430 98 C 430 290 352 420 256 470 C 160 420 82 290 82 98 Z"
          fill="url(#shieldBg)" stroke="url(#cyberBorder)" stroke-width="16" stroke-linejoin="round" />

    <!-- Git Branching Fork -->
    <g transform="translate(196, 120)">
      <path d="M 28 80 L 28 20 M 28 44 C 28 44 92 40 92 20" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
      <circle cx="28" cy="80" r="16" fill="#020617" stroke="#38bdf8" stroke-width="10" />
      <circle cx="28" cy="20" r="16" fill="#020617" stroke="#818cf8" stroke-width="10" />
      <circle cx="92" cy="20" r="16" fill="#020617" stroke="#c084fc" stroke-width="10" />
    </g>

    <!-- Monogram G -->
    <path d="M 264 240 L 204 240 C 174 240 152 262 152 292 L 152 328 C 152 358 174 380 204 380 L 260 380 C 290 380 312 358 312 328 L 312 300 L 240 300" 
          fill="none" stroke="url(#goldAccent)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text Mark: "GitFC" -->
  <text x="160" y="96" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="72" fill="#ffffff" letter-spacing="-2">
    Git<tspan fill="url(#cyberBorder)">FC</tspan>
  </text>

  <!-- Tag Pill: "ARENA" -->
  <rect x="365" y="46" width="94" height="28" rx="14" fill="#030712" stroke="#38bdf8" stroke-width="2" />
  <text x="412" y="65" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="13" fill="#38bdf8" letter-spacing="2.5">ARENA</text>

  <!-- Subtitle Descriptor -->
  <text x="164" y="128" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#94a3b8" letter-spacing="1.5">
    COMPETITIVE DEVELOPER CARD BATTLER
  </text>
</svg>
